name: test

on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand: gh workflow run test (or the Actions tab)
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/packaging/package.py --output dist/first
      - run: python3 scripts/packaging/package.py --revision 2 --output dist/second
      - name: Verify extracted distribution
        run: python3 scripts/packaging/check_package.py dist/first/*.deb
      - name: Verify dpkg install, upgrade, downgrade and removal
        run: python3 scripts/packaging/check_package_install.py dist/first/*.deb dist/second/*.deb
      - name: Verify checksums
        working-directory: dist/first
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-package
          path: dist/first/*
          if-no-files-found: error
