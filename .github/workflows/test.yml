name: test

on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand: gh workflow run test (or the Actions tab)
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tests/requirements.txt
      - run: pytest -v

  # The server: Rust tests and both static targets (native/build.sh), then the Python service's recorded
  # answers (native/tools/equivalence/golden) on fake trees, configurations and the runtime, and a live HTTP check.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the server (Rust tests, amd64 and arm64, the system allocator)
        run: native/build.sh
      # Released; these runners cannot run 32-bit code, so armhf-userspace runs its package under QEMU.
      - name: Build the 32-bit ARM server (armhf)
        run: native/build-armhf.sh
      - name: Compare with the recorded answers
        env:
          SERVER: native/target/x86_64-unknown-linux-musl/release/platmon-server
        run: |
          python3 native/tools/equivalence/config_fixture.py "$SERVER"
          python3 native/tools/equivalence/runtime_fixture.py "$SERVER"
          native/tools/equivalence/fixture.sh
          python3 native/tools/equivalence/live_http.py "$SERVER"
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-server
          path: native/target/*-unknown-linux-musl*/release/platmon-server
          if-no-files-found: error

  # Windows: the server builds with the MSVC toolchain and its tests pass; the smoke test (tools/windows_smoke.py)
  # runs collect, serve with its observations, and the server as a Windows service, on the runner.
  native-windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"   # native/build.sh's image
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - name: Rust tests
        run: cargo test --release --locked --no-default-features
      - name: Build
        run: cargo build --release --locked --no-default-features
      - name: Smoke test
        run: python tools/windows_smoke.py target/release/platmon-server.exe

  package:
    needs: [test, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: platmon-server
          path: native/target
      - name: Install package policy checker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lintian
      - run: python3 scripts/packaging/package.py --output dist/first
      - run: python3 scripts/packaging/package.py --revision 2 --output dist/second
      - name: Check package policy
        run: lintian --no-cfg --info --pedantic --fail-on error,warning dist/first/*.deb dist/second/*.deb
      - name: Verify checksums
        working-directory: dist/first
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-package
          path: dist/first/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second/*.deb
          if-no-files-found: error

  # Each architecture's package on a runner of that architecture, in each Ubuntu release's userspace.
  ubuntu-userspace:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-package
          path: dist/first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second
      # The only step that uses the Ubuntu mirrors: it retries a mirror in the middle of a sync, and the
      # checks below run in this local image (never pushed) without the network (#96).
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 20
        run: python3 scripts/packaging/prepare_test_image.py ubuntu:${{ matrix.ubuntu }} platmon-package-test:local
      - name: Check extracted package with the OS default Python
        run: |
          docker run --rm --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/checkout,readonly" \
            platmon-package-test:local sh -ec '
              python3 --version
              python3 /checkout/scripts/packaging/check_package.py /checkout/dist/first/*_${{ matrix.arch }}.deb
            '
      # Ubuntu 20.04 is an observation target, outside official native support.
      # The package requires Python >= 3.9; never force dependencies.
      - name: Check package lifecycle
        if: matrix.ubuntu != '20.04'
        run: python3 scripts/packaging/check_package_install.py dist/first/*_${{ matrix.arch }}.deb dist/second/*_${{ matrix.arch }}.deb --image platmon-package-test:local
      # The last release with the Python server: the package users upgrade from.
      - name: Fetch the previous release
        if: matrix.ubuntu != '20.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --dir previous \
            --pattern platmon_1.3.0-1_all.deb --pattern SHA256SUMS
          (cd previous && grep ' platmon_1.3.0-1_all.deb$' SHA256SUMS | sha256sum -c)
      - name: Check the service under systemd (upgrade, failed start, recovery, boot)
        if: matrix.ubuntu != '20.04'
        run: python3 scripts/packaging/check_package_service.py previous/platmon_1.3.0-1_all.deb dist/second/*_${{ matrix.arch }}.deb --image platmon-package-test:local

  # armhf has no GitHub runner (the arm64 ones are AArch64 only): its package in a 32-bit ARM userspace
  # under QEMU, on Debian 13 (Raspberry Pi OS's base) and Ubuntu 24.04: the smoke check and the dpkg
  # lifecycle. Not the service under systemd: under QEMU user emulation the unit's sandbox does not start
  # (even 1.3.0's on Debian) and a process's executable is qemu-arm (native/README.md, 32-bit ARM).
  armhf-userspace:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:13", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-package
          path: dist/first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 30
        run: python3 scripts/packaging/prepare_test_image.py --platform linux/arm/v7 ${{ matrix.base }} platmon-package-test:local
      - name: Check extracted package with the OS default Python
        run: |
          docker run --rm --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/checkout,readonly" \
            platmon-package-test:local sh -ec '
              python3 --version
              dpkg --print-architecture
              python3 /checkout/scripts/packaging/check_package.py /checkout/dist/first/*_armhf.deb
            '
      - name: Check package lifecycle
        run: python3 scripts/packaging/check_package_install.py dist/first/*_armhf.deb dist/second/*_armhf.deb --image platmon-package-test:local

  # The .rpm packages (scripts/packaging/package_rpm.py), from the same server builds, with Ubuntu's rpmbuild:
  # their tests, two releases for the upgrade and rpmlint in a Fedora container.
  rpm:
    needs: [test, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: platmon-server
          path: native/target
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: python -m pip install -r tests/requirements.txt
      - run: pytest -v tests/packaging/test_rpm.py
      - run: python3 scripts/packaging/package_rpm.py --output dist/rpm-first
      - run: python3 scripts/packaging/package_rpm.py --release 2 --output dist/rpm-second
      - name: Verify checksums
        working-directory: dist/rpm-first
        run: sha256sum -c SHA256SUMS
      - name: Check package policy (rpmlint)
        timeout-minutes: 20
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/checkout,readonly" fedora:44 sh -ec '
            dnf install -y -q rpmlint
            LC_ALL=C.UTF-8 rpmlint -c /checkout/packaging/rpm/rpmlint.toml /checkout/dist/rpm-first /checkout/dist/rpm-second
          '
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-rpm
          path: dist/rpm-first/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-rpm-upgrade-fixture
          path: dist/rpm-second/*.rpm
          if-no-files-found: error

  # Each architecture's .rpm on a runner of that architecture, under a booted systemd in Fedora, in
  # Enterprise Linux 9 (the oldest Python the CLI takes, 3.9) and in CentOS Stream 10 (Enterprise Linux 10).
  rpm-userspace:
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        base: ["fedora:44", "almalinux:9", "quay.io/centos/centos:stream10"]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-rpm
          path: dist/rpm-first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-rpm-upgrade-fixture
          path: dist/rpm-second
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 20
        run: python3 scripts/packaging/prepare_test_image.py ${{ matrix.base }} platmon-rpm-test:local
      - name: Check the packages under systemd (install, upgrade, invalid INI, failed start, downgrade, erase)
        run: python3 scripts/packaging/check_rpm.py dist/rpm-first/platmon-*.${{ matrix.arch }}.rpm dist/rpm-second/platmon-*.${{ matrix.arch }}.rpm --image platmon-rpm-test:local
