name: test

on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand: gh workflow run test (or the Actions tab)
  workflow_call:

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest: setup-python has no 3.8 or 3.9 build for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tests/requirements.txt
      - run: pytest -v

  # The server and the platmon command: Rust tests and both static targets (native/build.sh), then the Python
  # service's recorded answers (native/tools/equivalence/golden) on fake trees, configurations and the runtime, a
  # live HTTP check, and the command's live screens (tests/frontends, through its --screen-script).
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the server (Rust tests, amd64 and arm64, the system allocator)
        run: native/build.sh
      # The tray's StatusNotifierItem on a private session bus (frontend/tests/tray.rs), which build.sh's container
      # skips without dbus-daemon: the same image as root installs it, then runs the test as the runner's user
      # (dbus-daemon wants a passwd entry for it), reusing build.sh's release build.
      - name: Check the tray on a session bus (dbus-daemon)
        run: >-
          docker run --rm -e CARGO_HOME=/src/target/cargo-home -v "$PWD/native":/src -v "$PWD/VERSION":/VERSION:ro -w /src
          rust:1.88-slim bash -euo pipefail -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends dbus-daemon >/dev/null
          && echo build:x:$(id -u):$(id -g)::/tmp:/bin/sh >> /etc/passwd
          && setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups env HOME=/tmp PLATMON_REQUIRE_DBUS=1
          cargo test -q --release --locked --no-default-features -p platmon-frontend --test tray"
      # Released; these runners cannot run 32-bit code, so armhf-userspace runs its package under QEMU.
      - name: Build the 32-bit ARM server (armhf)
        run: native/build-armhf.sh
      - name: Compare with the recorded answers
        env:
          SERVER: native/target/x86_64-unknown-linux-musl/release/platmon-server
        run: |
          python3 native/tools/equivalence/config_fixture.py "$SERVER"
          python3 native/tools/equivalence/runtime_fixture.py "$SERVER"
          native/tools/equivalence/fixture.sh
          python3 native/tools/equivalence/live_http.py "$SERVER"
      # the tests that run the binary (skipped in the test job, which has none)
      - name: Check the platmon command's screens
        run: |
          python3 -m pip install -r tests/requirements.txt
          python3 -m pytest tests/frontends/test_cli_screen.py tests/frontends/test_ui_spec.py
      # The released fleet server, pinned by hash, reads this server's answers (native/README.md)
      - name: Check the fleet server's contract (platmon-hub from PyPI)
        env:
          SERVER: native/target/x86_64-unknown-linux-musl/release/platmon-server
        run: |
          python3 -m venv "$RUNNER_TEMP/hub"
          "$RUNNER_TEMP/hub/bin/pip" install --quiet --require-hashes -r native/tools/equivalence/hub-requirements.txt
          "$RUNNER_TEMP/hub/bin/python" -I native/tools/equivalence/hub_contract.py "$SERVER"
      # the servers, the platmon commands and the trays beside them (platmon-frontend's)
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-server
          path: |
            native/target/*-unknown-linux-musl*/release/platmon-server
            native/target/*-unknown-linux-musl*/release/platmon
            native/target/*-unknown-linux-musl*/release/platmon-tray
          if-no-files-found: error

  # Windows: the server and the platmon command build with the MSVC toolchain, the C runtime linked statically (no Visual C++
  # Redistributable to install), and its tests pass; the smoke test (tools/windows_smoke.py) runs collect, serve
  # with its observations, the server as a Windows service, and the zip's scripts, on the runner.
  native-windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"   # native/build.sh's image
      RUSTFLAGS: "-C target-feature=+crt-static"
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - name: Rust tests
        run: cargo test --release --locked --no-default-features
      - name: Build
        run: cargo build --release --locked --no-default-features
      - name: Smoke test
        run: python tools/windows_smoke.py target/release/platmon-server.exe
      # The installer of these binaries (platmon.exe and platmon-tray.exe beside the server), with Windows Installer itself (scripts/packaging/package_msi.py); the smoke
      # test installed, upgraded and removed packages built the same way.
      - name: Installer
        run: python ../scripts/packaging/package_msi.py --binary target/release/platmon-server.exe --output target/msi
      # The zip packages these binaries (scripts/packaging/package_windows.py), the installer beside it; the smoke test
      # ran the tray's --version and checked its HKLM Run value from the installer.
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-server-windows
          path: |
            native/target/release/platmon-server.exe
            native/target/release/platmon.exe
            native/target/release/platmon-tray.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-msi-windows
          path: native/target/msi/*.msi
          if-no-files-found: error

  package:
    needs: [test, native, native-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: platmon-server
          path: native/target
      - uses: actions/download-artifact@v4
        with:
          name: platmon-server-windows
          path: native/target/release
      - uses: actions/download-artifact@v4
        with:
          name: platmon-msi-windows
          path: native/target/msi
      - name: Install package policy checker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lintian
      - run: python3 scripts/packaging/package.py --output dist/first
      - run: python3 scripts/packaging/package_windows.py --output dist/first --msi native/target/msi/platmon-$(cat VERSION)-windows-x86_64.msi
      - run: python3 scripts/packaging/package.py --revision 2 --output dist/second
      - name: Check package policy
        run: lintian --no-cfg --info --pedantic --fail-on error,warning dist/first/*.deb dist/second/*.deb
      - name: Verify checksums
        working-directory: dist/first
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-package
          path: dist/first/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second/*.deb
          if-no-files-found: error

  # Each architecture's package on a runner of that architecture, in each Ubuntu release's userspace.
  ubuntu-userspace:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-package
          path: dist/first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second
      # The only step that uses the Ubuntu mirrors: it retries a mirror in the middle of a sync, and the
      # checks below run in this local image (never pushed) without the network (#96).
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 20
        run: python3 scripts/packaging/prepare_test_image.py ubuntu:${{ matrix.ubuntu }} platmon-package-test:local
      - name: Check extracted package with the OS default Python
        run: |
          docker run --rm --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/checkout,readonly" \
            platmon-package-test:local sh -ec '
              python3 --version
              python3 /checkout/scripts/packaging/check_package.py /checkout/dist/first/platmon_*_${{ matrix.arch }}.deb
            '
      # Ubuntu 20.04 is an observation target, outside official native support; never force dependencies.
      - name: Check package lifecycle
        if: matrix.ubuntu != '20.04'
        run: python3 scripts/packaging/check_package_install.py dist/first/platmon_*_${{ matrix.arch }}.deb dist/second/platmon_*_${{ matrix.arch }}.deb --image platmon-package-test:local
      # The last release with the Python server: the package users upgrade from.
      - name: Fetch the previous release
        if: matrix.ubuntu != '20.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --dir previous \
            --pattern platmon_1.3.0-1_all.deb --pattern SHA256SUMS
          (cd previous && grep ' platmon_1.3.0-1_all.deb$' SHA256SUMS | sha256sum -c)
      - name: Check the service under systemd (upgrade, failed start, recovery, boot)
        if: matrix.ubuntu != '20.04'
        run: python3 scripts/packaging/check_package_service.py previous/platmon_1.3.0-1_all.deb dist/second/platmon_*_${{ matrix.arch }}.deb --image platmon-package-test:local

  # armhf has no GitHub runner (the arm64 ones are AArch64 only): its package in a 32-bit ARM userspace
  # under QEMU, on Debian 13 (Raspberry Pi OS's base) and Ubuntu 24.04: the smoke check and the dpkg
  # lifecycle. Not the service under systemd: under QEMU user emulation the unit's sandbox does not start
  # (even 1.3.0's on Debian) and a process's executable is qemu-arm (native/README.md, 32-bit ARM).
  armhf-userspace:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:13", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-package
          path: dist/first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-upgrade-fixture
          path: dist/second
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 30
        run: python3 scripts/packaging/prepare_test_image.py --platform linux/arm/v7 ${{ matrix.base }} platmon-package-test:local
      - name: Check extracted package with the OS default Python
        run: |
          docker run --rm --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/checkout,readonly" \
            platmon-package-test:local sh -ec '
              python3 --version
              dpkg --print-architecture
              python3 /checkout/scripts/packaging/check_package.py /checkout/dist/first/platmon_*_armhf.deb
            '
      - name: Check package lifecycle
        run: python3 scripts/packaging/check_package_install.py dist/first/platmon_*_armhf.deb dist/second/platmon_*_armhf.deb --image platmon-package-test:local

  # The .rpm packages (scripts/packaging/package_rpm.py), from the same server builds, with Ubuntu's rpmbuild:
  # their tests, two releases for the upgrade and rpmlint in a Fedora container.
  rpm:
    needs: [test, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: platmon-server
          path: native/target
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: python -m pip install -r tests/requirements.txt
      - run: pytest -v tests/packaging/test_rpm.py
      - run: python3 scripts/packaging/package_rpm.py --output dist/rpm-first
      - run: python3 scripts/packaging/package_rpm.py --release 2 --output dist/rpm-second
      - name: Verify checksums
        working-directory: dist/rpm-first
        run: sha256sum -c SHA256SUMS
      - name: Check package policy (rpmlint)
        timeout-minutes: 20
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/checkout,readonly" fedora:44 sh -ec '
            dnf install -y -q rpmlint
            LC_ALL=C.UTF-8 rpmlint -c /checkout/packaging/rpm/rpmlint.toml /checkout/dist/rpm-first /checkout/dist/rpm-second
          '
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-rpm
          path: dist/rpm-first/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: platmon-rpm-upgrade-fixture
          path: dist/rpm-second/*.rpm
          if-no-files-found: error

  # Each architecture's .rpm on a runner of that architecture, under a booted systemd in Fedora, in
  # Enterprise Linux 9 and in CentOS Stream 10 (Enterprise Linux 10).
  rpm-userspace:
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        base: ["fedora:44", "almalinux:9", "quay.io/centos/centos:stream10"]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platmon-rpm
          path: dist/rpm-first
      - uses: actions/download-artifact@v4
        with:
          name: platmon-rpm-upgrade-fixture
          path: dist/rpm-second
      # The prepared image is kept in the Actions cache for the ISO week (#166): a slow mirror can take longer
      # than prepare_test_image.py's three attempts (AlmaLinux 9's BaseOS and AppStream metadata are 88 MB),
      # so the mirrors are used once a week per base and architecture, and again when the script changes.
      - name: Name the test image's cache
        id: image-cache
        run: echo "key=rpm-test-image-${{ matrix.base }}-${{ matrix.arch }}-$(date -u +%G-W%V)-${{ hashFiles('scripts/packaging/prepare_test_image.py') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: image-restore
        with:
          path: rpm-test-image.tar
          key: ${{ steps.image-cache.outputs.key }}
      - name: Prepare the test image (python3, systemd)
        timeout-minutes: 20
        run: |
          if [ -f rpm-test-image.tar ]; then
            docker load -i rpm-test-image.tar
          else
            python3 scripts/packaging/prepare_test_image.py ${{ matrix.base }} platmon-rpm-test:local
            docker save -o rpm-test-image.tar platmon-rpm-test:local
          fi
      # saved now, not after the checks, so that a failing check does not cost the next run the mirrors again
      - if: steps.image-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rpm-test-image.tar
          key: ${{ steps.image-cache.outputs.key }}
      - name: Check the packages under systemd (install, upgrade, invalid INI, failed start, downgrade, erase)
        run: python3 scripts/packaging/check_rpm.py dist/rpm-first/platmon-[0-9]*.${{ matrix.arch }}.rpm dist/rpm-second/platmon-[0-9]*.${{ matrix.arch }}.rpm --image platmon-rpm-test:local
