[package]
name = "platmon-native"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "The platmon server the Debian package runs (native/README.md)"

[dependencies]
# MIT OR Apache-2.0, no dependencies of its own: system call numbers, flags and struct layouts per target,
# instead of hand-written ones (statvfs, utsname, rusage, O_PATH, errno)
libc = "=0.2.172"
# MIT (mimalloc 3.3.2's C, built by its sys crate with cc; Cargo.lock pins every version): the outside
# allocator compared with the system one (README, System against mimalloc); off by default
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0, with windows-link (MIT OR Apache-2.0) its only dependency: the Win32 declarations
# platform/windows.rs and collect/windows call (WinSock, BCryptGenRandom, the interrupt time, the console,
# the system information calls, the registry, the volume's free space, the interface table, the disks'
# performance counters, the service control manager)
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemInformation", "Win32_Foundation",
                                                 "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
                                                 "Win32_Networking_WinSock", "Win32_Security_Cryptography",
                                                 "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO",
                                                 "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Services",
                                                 "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[features]
# the experimental size-class cache in front of the system allocator (src/alloc.rs); off by default
cache-alloc = []
# mimalloc as the global allocator; off by default, never with cache-alloc
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
strip = true
panic = "abort"
