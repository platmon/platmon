# Any Linux host:   docker compose -f deploy/docker/compose.yaml up -d --build (from the checkout root)
# Jetson:           docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.jetson.yaml up -d --build
name: platmon                   # fixed project name, so deploy/docker/stop.sh finds it from any clone
services:
  platmon:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # No provenance attestation: it records the build time and git commit, so every build got a new
      # image id even with identical content. The tag then moved off the running container's image,
      # which got deleted while compose (seeing the same content) kept the container on it.
      # Images are built locally and never published, so the attestation has no use here.
      # Some compose versions ignore this key; deploy/docker/start.sh also sets BUILDX_NO_DEFAULT_ATTESTATIONS=1.
      provenance: false
    image: platmon:local
    init: true                  # forward docker stop's SIGTERM promptly
    uts: host                   # host's hostname, the model name fallback on hosts without DMI / device tree
    restart: unless-stopped
    # Linux host interfaces and Wi-Fi must be read in the same network namespace.
    # The HTTP bind/port comes directly from platmon.ini; do not publish ports in host mode.
    network_mode: host
    environment:
      PLATMON_DEVICE_TREE: /host/firmware/devicetree/base
      PLATMON_HOST_ROOT: /host/root
    volumes:
      # Docker hides /sys/firmware; the device tree there identifies Jetson / Raspberry Pi boards.
      # Hosts without one (PCs) still have /sys/firmware, so this mount works everywhere.
      - /sys/firmware:/host/firmware:ro
      # The host's root filesystem only, for disk usage. Not recursive, so the host's
      # /proc, /sys and /run (docker.sock) are not exposed through it.
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          recursive: disabled
      - ../../platmon.ini:/opt/platmon/platmon.ini:ro
